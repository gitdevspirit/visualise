org.gradle.jvmargs=-Xmx2g
org.gradle.parallel=true

# --- Minecraft / Ornithe -------------------------------------------------------
# Matches the Ornithe mod template. If Gradle complains that Loom needs a newer Gradle, bump the wrapper:
#   ./gradlew wrapper --gradle-version <version>
# (No Feather build is needed: names come from MCP via tools/MakeMcpMappings.java.)
minecraft_version=1.8.9
loader_version=0.16.10
# fabric-loom and ploceus must use the same version
loom_version=1.17-SNAPSHOT

# --- Mod -----------------------------------------------------------------------
mod_version=1.0
maven_group=myau
archives_base_name=Spirit-Visuals
modid=spiritvisuals
